services:
  - type: web
    name: buildready-ai
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn backend.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FOUNDER_SECRET_KEY
        sync: false
      - key: CORS_ALLOW_ORIGINS
        value: "*"
